[project]
name = "fizzbuzz-tdd-kata"
version = "0.1.0"
description = "A Test-Driven Development kata for implementing and packaging FizzBuzz with pytest, Marimo, uv, and GitHub Actions."
readme = "README.md"
authors = [
    { name = "Matthieu Ringard", email = "matt33.ringard@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.ruff.lint.per-file-ignores]
"notebook.py" = ["B018"]


[tool.hatch.build.targets.wheel]
packages = ["src/fizzbuzz_kata"]